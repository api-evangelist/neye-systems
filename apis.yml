aid: neye-systems
name: nEye Systems
description: >-
  nEye (nEye.ai, formerly nEye Systems) is a silicon photonics company in Santa Clara and
  Emeryville, California building an optical circuit switch on a chip — a programmable photonic
  integrated circuit that combines silicon photonics, MEMS and CMOS to switch light directly
  between GPUs, CPUs and memory inside AI and high-performance computing data centers, marketed
  as the SuperSwitch. The company was spun out of University of California, Berkeley research by
  co-founder and chief scientist Ming C. Wu and is led by CEO Ashish Vengsarkar. It raised an
  $80M Series C led by Sutter Hill Ventures in April 2026, bringing total funding to $152M with
  participation from CapitalG, M12 and Socratic Partners, and it participates in the Open Compute
  Project Open OCS effort alongside Google, NVIDIA and Microsoft. nEye is a semiconductor and
  optical hardware company: as of this profile it publishes no developer program, API, SDK,
  webhook surface or machine-readable contract of any kind, and its entire public surface is a
  seven-page marketing site.
